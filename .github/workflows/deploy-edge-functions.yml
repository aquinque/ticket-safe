name: Deploy Edge Functions

# Separate from "Deploy to GitHub Pages": the site is built and published by its own
# workflow, so nothing here can hold back or turn red a site deploy.
#
# It runs only when the code of a function listed below changes on main (or by hand
# from the Actions tab). Payment functions (checkouts, webhooks, payouts, refunds,
# anything that calls Stripe or Revolut) are NEVER deployed from here: they are
# deployed by hand, one at a time, after a check.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a personal access token from
# https://supabase.com/dashboard/account/tokens), set in GitHub under
# Settings > Secrets and variables > Actions > New repository secret.
# Without it the job says so and ends green, deploying nothing.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ticket-access/**"
      - "supabase/functions/export-event-sales/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "edge-functions"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Is the Supabase token set?
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set: nothing deployed."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.token.outputs.set == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the non-payment functions
        if: steps.token.outputs.set == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'lgmnatfvdzzjzyxlenry' }}
        run: |
          # ticket-access (guest ticket page) and export-event-sales (Studio sales CSV) only.
          # Keep this list in sync with the paths above, and never add a payment function.
          for fn in ticket-access export-event-sales; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
