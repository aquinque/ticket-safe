name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Event link previews are written into the site at build time (scripts/prerender-event-pages.mjs). Every 10 minutes
  # the `changes` job compares the published events with the list the live site was built from, and the site is only
  # rebuilt when an event was published or edited, so a link shared soon after shows the event's preview.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Did a published event change since the last build?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lgmnatfvdzzjzyxlenry.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnbW5hdGZ2ZHp6anp5eGxlbnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjE2ODUsImV4cCI6MjA4ODE5NzY4NX0.u3ZbqKzuO2vXkck3BvyEgE0Cn9SVez89AYB2XPHE3LY' }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Same request as scripts/prerender-event-pages.mjs (EVENTS_QUERY), hashed the same way.
          query="/rest/v1/events?select=slug,title,description,seo_description,og_image_url,banner_url,date,location,currency&status=eq.published&slug=not.is.null&order=slug.asc&limit=2000"
          live=$(curl -sf "${SUPABASE_URL%/}$query" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" | sha256sum | cut -d' ' -f1) || live=""
          built=$(curl -sf "https://ticket-safe.eu/og/events-hash.txt?t=$(date +%s)" | tr -d '[:space:]') || built=""
          if [ -n "$live" ] && [ "$live" = "$built" ]; then
            echo "Events unchanged since the last build."; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Events changed (live ${live:-?}, built ${built:-none}): rebuilding."; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public Supabase values (anon key — safe to expose in browser bundles)
          # Override by setting VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
          # as GitHub repository secrets (Settings → Secrets and variables → Actions).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lgmnatfvdzzjzyxlenry.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnbW5hdGZ2ZHp6anp5eGxlbnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjE2ODUsImV4cCI6MjA4ODE5NzY4NX0.u3ZbqKzuO2vXkck3BvyEgE0Cn9SVez89AYB2XPHE3LY' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy Supabase Edge Functions on every push to main.
  # Runs independently of the frontend build. Skips cleanly (does not fail the
  # pipeline) until SUPABASE_ACCESS_TOKEN is set as a repository secret:
  #   Settings → Secrets and variables → Actions → New repository secret
  #     SUPABASE_ACCESS_TOKEN  — from https://supabase.com/dashboard/account/tokens
  #     SUPABASE_PROJECT_REF   — (optional) overrides the default project ref below
  # Per-function settings (e.g. verify_jwt=false for stripe-webhook) come from
  # supabase/config.toml, which `functions deploy` honours.
  deploy-functions:
    # Never on the 10-minute schedule, which only refreshes the site's event pages.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without the token there is nothing to deploy: check it first, so the CLI
      # download (a GitHub API call that can hit its rate limit) only happens when
      # it is needed and can never turn a site-only push red.
      - name: Edge Function deploy configured?
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping Edge Function deploy."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.token.outputs.set == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.token.outputs.set == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'lgmnatfvdzzjzyxlenry' }}
        run: |
          # Deploy only the functions this repo is known to match production for.
          # A full deploy would overwrite production code that the repo does not
          # carry (for example mark-payout-batch-sent is a stub on disk). replay-order-email
          # is deployed by hand once the guest ticket page is live. export-event-sales
          # (the Studio sales CSV) was born in this repo, so the repo is its only source.
          for fn in ticket-access revolut-create-checkout export-event-sales; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
