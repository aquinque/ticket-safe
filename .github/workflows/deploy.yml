name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Sent by the database (public.request_site_rebuild) as soon as a published event is
  # created, edited, cancelled or unpublished, so its link preview is ready within minutes.
  repository_dispatch:
    types: [events-changed]
  # Event link previews are written into the site at build time (scripts/prerender-event-pages.mjs). Every 10 minutes
  # the `changes` job compares the published events with the list the live site was built from, and the site is only
  # rebuilt when an event was published or edited. This is the safety net for the dispatch above.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Did a published event change since the last build?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lgmnatfvdzzjzyxlenry.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnbW5hdGZ2ZHp6anp5eGxlbnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjE2ODUsImV4cCI6MjA4ODE5NzY4NX0.u3ZbqKzuO2vXkck3BvyEgE0Cn9SVez89AYB2XPHE3LY' }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Same request as scripts/prerender-event-pages.mjs (EVENTS_QUERY), hashed the same way.
          query="/rest/v1/events?select=slug,title,description,seo_description,og_image_url,banner_url,date,location,currency&status=eq.published&slug=not.is.null&order=slug.asc&limit=2000"
          live=$(curl -sf "${SUPABASE_URL%/}$query" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" | sha256sum | cut -d' ' -f1) || live=""
          built=$(curl -sf "https://ticket-safe.eu/og/events-hash.txt?t=$(date +%s)" | tr -d '[:space:]') || built=""
          if [ -n "$live" ] && [ "$live" = "$built" ]; then
            echo "Events unchanged since the last build."; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Events changed (live ${live:-?}, built ${built:-none}): rebuilding."; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public Supabase values (anon key — safe to expose in browser bundles)
          # Override by setting VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
          # as GitHub repository secrets (Settings → Secrets and variables → Actions).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lgmnatfvdzzjzyxlenry.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnbW5hdGZ2ZHp6anp5eGxlbnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjE2ODUsImV4cCI6MjA4ODE5NzY4NX0.u3ZbqKzuO2vXkck3BvyEgE0Cn9SVez89AYB2XPHE3LY' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
