project_id = "lgmnatfvdzzjzyxlenry"

# Disable gateway JWT verification for functions that handle auth internally.
# These functions use service-role client + getUser(token) for authentication,
# so the gateway check is redundant and causes "Invalid JWT" errors.
[functions.submit-listing]
verify_jwt = false

[functions.verify-qr]
verify_jwt = false

[functions.stripe-create-checkout]
verify_jwt = false

# Send Email Hook — called by Supabase Auth itself with Standard Webhooks
# signature. JWT verification must be disabled because the hook is unauthenticated.
[functions.send-auth-email]
verify_jwt = false

# Studio primary-sale checkout — authenticated buyer creates a Stripe
# Checkout Session with destination charges to the organizer's Connect account.
# Internally uses service-role client + getUser(token), so gateway JWT
# verification is redundant.
[functions.studio-create-checkout]
verify_jwt = false

# Studio primary-sale checkout via Revolut Merchant — the function EventPublic.tsx
# actually calls (Revolut is the live payment provider; studio-create-checkout/
# Stripe above stays deployed as a dormant fallback). Same internal auth pattern.
[functions.revolut-create-checkout]
verify_jwt = false

# Resale checkout via Revolut Merchant — same guest-checkout path as
# revolut-create-checkout (no account required to buy); the gateway must not
# reject unauthenticated requests before the function's own guest-or-user
# logic gets to run.
[functions.revolut-resale-checkout]
verify_jwt = false

# Organizer notification emails. Authenticated; auth-handled inside the
# function (owner for new_application, admin for approve/reject).
[functions.organizer-notify]
verify_jwt = false

# Stripe Express dashboard login link. Authenticated; internal auth via getUser.
[functions.stripe-express-dashboard]
verify_jwt = false

# Event ticket QR generator. Authenticated; serves the QR SVG only to the
# ticket's buyer (verified inside the function).
[functions.event-ticket-qr]
verify_jwt = false

# Studio door scan validator. Authenticated; checks the scanner is the
# event's organizer or an admin before flipping scanned_at.
[functions.validate-event-ticket]
verify_jwt = false

# Cancel event + refund all paid orders (organizer-only, Stripe refunds).
[functions.cancel-event]
verify_jwt = false

# Ticket availability alerts — invoked by a DB trigger (pg_net) when a resale
# ticket goes live. Emails users who tapped "Notify me" for that event.
[functions.notify-ticket-alerts]
verify_jwt = false

# New-event alerts — invoked by a DB trigger (pg_net) when an event is
# published. Emails users who follow the organizer.
[functions.notify-event-followers]
verify_jwt = false

# Revolut's own webhook call — never carries a Supabase user JWT. The
# function verifies completion itself (GET /orders/{id} against Revolut,
# no shared secret needed), so gateway JWT verification only risks
# rejecting genuine Revolut deliveries before they're ever checked.
[functions.revolut-webhook]
verify_jwt = false

# Same reasoning — Stripe's webhook signs its own payload; it carries no
# Supabase JWT either. Dormant fallback today, but should never gateway-401
# if Stripe is ever reactivated.
[functions.stripe-webhook]
verify_jwt = false